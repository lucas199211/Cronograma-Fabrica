/* ============================ datas ============================ */
const DAY=86400000;
function d2s(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function s2d(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffD(a,b){return Math.round((b-a)/DAY)}
function fmt(s){if(!s)return'—';const d=s2d(s);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)}
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// input type="date" nativo segue o idioma do sistema/navegador (não o lang da
// página), então em máquina com Windows em inglês mostrava mm/dd/aaaa. Por
// isso os campos de data da gaveta usam texto livre dd/mm/aaaa, convertido
// pra ISO (aaaa-mm-dd, o formato usado internamente em todo o resto do
// código) na hora de salvar.
function isoToBR(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  return d+'/'+m+'/'+y;
}
function brToISO(txt){
  const m=txt.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3];
  return y+'-'+mo+'-'+d;
}
// converte o campo pro formato ISO; vazio limpa a data, formato inválido
// mantém o valor anterior (não corrompe o dado) e avisa o motivo
function parseDateField(txt,fallback){
  const t=txt.trim();
  if(!t) return '';
  const iso=brToISO(t);
  if(iso===null) alert('Data "'+t+'" não reconhecida (use dd/mm/aaaa). Mantendo a data anterior.');
  return iso!==null?iso:(fallback||'');
}
// formata como "R$ 1.234,56": ponto a cada 3 dígitos na parte inteira,
// vírgula pra centavos (só aparece se a pessoa digitar uma vírgula).
// Também reformata valores já salvos antes dessa máscara existir (ex:
// "R$ 350000" vira "R$ 350.000" ao reabrir a gaveta). Campo vazio continua
// vazio, pra dar pra limpar o valor.
function fmtMoney(v){
  const raw=String(v||'').replace(/^R\$\s*/,'').replace(/[^\d,]/g,'');
  if(!raw) return '';
  const commaIdx=raw.indexOf(',');
  let intPart=commaIdx===-1?raw:raw.slice(0,commaIdx);
  const decPart=commaIdx===-1?null:raw.slice(commaIdx+1).replace(/,/g,'').slice(0,2);
  intPart=intPart.replace(/^0+(?=\d)/,'')||'0';
  const grouped=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return 'R$ '+grouped+(decPart!==null?','+decPart:'');
}
// inverso do fmtMoney: "R$ 1.234,56" -> 1234.56, pra dar pra comparar
// valores numericamente (ex: escolher o menor orçamento automaticamente)
function parseMoneyValue(txt){
  const raw=String(txt||'').replace(/^R\$\s*/,'').trim();
  if(!raw) return null;
  const n=parseFloat(raw.replace(/\./g,'').replace(',','.'));
  return isNaN(n)?null:n;
}
// formata um número (não texto digitado) como "R$ 1.234,56" — usado pra
// mostrar somatórias calculadas (ex: total dos melhores orçamentos de um
// grupo). Só mostra centavos se o total realmente tiver centavos.
function fmtMoneyNum(n){
  const cents=Math.round((n||0)*100);
  const grouped=Math.trunc(Math.abs(cents)/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const dec=Math.abs(cents)%100;
  return (cents<0?'-':'')+'R$ '+grouped+(dec?','+String(dec).padStart(2,'0'):'');
}
// soma o valor do "melhor orçamento" (o fornecedor escolhido, manual ou
// automático) de cada atividade da lista — usado no cabeçalho de cada
// grupo, pra dar uma visão rápida de quanto o grupo já está custando.
function melhorTotalDoGrupo(list){
  return list.reduce((s,a)=>{
    const nome=(a.melhorOrcamento||'').trim();
    if(!nome) return s;
    const cot=(a.cotacoes||[]).find(c=>c&&(c.forn||'').trim()===nome);
    const v=cot?parseMoneyValue(cot.valor):null;
    return s+(v>0?v:0);
  },0);
}

/* ============================ status ============================ */
function statusOf(a){
  if(!a.ini||!a.fim) return 'semdata';
  if((a.pct||0)>=100) return 'feito';
  if(s2d(a.fim)<today()) return 'atrasado';
  if((a.pct||0)>0) return 'andamento';
  if(s2d(a.ini)<=today()) return 'andamento';
  return 'previsto';
}
function lateDays(a){
  if(statusOf(a)!=='atrasado') return 0;
  return diffD(s2d(a.fim),today());
}
function hasAnexo(a){
  return (a.cotacoes||[]).some(c=>c&&c.anexo);
}
function hasNota(a){
  return !!(a.nota&&a.nota.trim());
}

/* ============================ armazenamento (supabase) ============================ */
async function load(){
  const {data,error}=await db.from('cronograma_state').select('data').eq('id',1).maybeSingle();
  if(error){ toast('Não deu para carregar do servidor: '+error.message); return null; }
  return data?data.data:null;
}
let saveT=null;
// Usa o retrato de "state" tirado no momento do clique/edição (dataToSave),
// não o "state" atual — porque a sincronização em tempo real (mais abaixo)
// troca a variável "state" inteira sempre que qualquer mudança chega do
// servidor. Se essa troca acontecesse durante os 350ms de espera do
// save(), a gravação usaria dados sem a edição que a pessoa acabou de
// fazer, mesmo sem dar erro nenhum — era exatamente essa a causa do
// "às vezes salva, às vezes não".
//
// Isso sozinho não basta quando VÁRIAS pessoas editam ao mesmo tempo: se o
// retrato local for antigo, salvar ele por cima do documento inteiro apaga
// silenciosamente o que outra pessoa acabou de gravar. Por isso, antes de
// gravar, buscamos a versão mais recente do servidor e mesclamos atividade
// por atividade (usando o carimbo _ts de cada uma) em vez de sobrescrever
// tudo de uma vez — era essa a causa dos relatos de "lancei a informação e
// ela não ficou salva".
// A ordem de um Map segue a ordem de inserção das CHAVES; dar set() numa
// chave que já existe só troca o valor, não move a posição. Por isso a
// base tem que ser sempre a ordem local: ela é quem carrega qualquer
// reordenação (arrastar atividade dentro/entre grupos) que a pessoa
// acabou de fazer. Se a base fosse a ordem remota (como era antes), toda
// reordenação local seria silenciosamente desfeita no próximo salvamento
// — era exatamente a causa de "arrasto a atividade e ela volta pro
// lugar de onde saiu".
function mergeActs(localActs,remoteActs,deletedIds){
  const byId=new Map();
  (localActs||[]).forEach(a=>{
    if(deletedIds&&deletedIds.has(a.id)) return;
    byId.set(a.id,a);
  });
  (remoteActs||[]).forEach(r=>{
    if(deletedIds&&deletedIds.has(r.id)) return;
    const l=byId.get(r.id);
    if(!l) byId.set(r.id,r); // atividade nova, de outra pessoa: inclui no fim
    else if((r._ts||0)>(l._ts||0)) byId.set(r.id,r); // conteúdo remoto mais novo: atualiza valor, mantém a posição local
  });
  return [...byId.values()];
}
// registro de exclusão é imutável (cada atividade só é excluída uma vez) —
// então basta uma união por id, sem precisar de carimbo pra decidir quem
// venceu
function mergeDeletados(local,remote){
  const byId=new Map();
  (remote||[]).forEach(x=>byId.set(x.id,x));
  (local||[]).forEach(x=>byId.set(x.id,x));
  return [...byId.values()];
}
async function saveNow(dataToSave,opts){
  const payload=dataToSave||state;
  const deletedIds=opts&&opts.deletedIds;
  const {data:remoteRow}=await db.from('cronograma_state').select('data').eq('id',1).maybeSingle();
  const remote=remoteRow&&remoteRow.data;
  let toSave=payload;
  if(remote&&remote.acts){
    const acts=mergeActs(payload.acts,remote.acts,deletedIds);
    const localPhasesTs=payload.phasesTs||0, remotePhasesTs=remote.phasesTs||0;
    const phases=(remotePhasesTs>localPhasesTs&&remote.phases)?remote.phases:payload.phases;
    const deletados=mergeDeletados(payload.deletados,remote.deletados);
    // comentário do gestor: mesma ideia do phasesTs — o texto mais
    // recente (local ou remoto) vence, em vez de sempre sobrescrever com
    // o que esta aba tinha, que apagaria silenciosamente um ajuste feito
    // por outra pessoa entre uma geração de PDF e outra
    const localComentTs=payload.comentarioGestorTs||0, remoteComentTs=remote.comentarioGestorTs||0;
    const comentarioGestor=(remoteComentTs>localComentTs&&remote.comentarioGestor!==undefined)
      ?remote.comentarioGestor:payload.comentarioGestor;
    toSave={...payload,acts,phases,phasesTs:Math.max(localPhasesTs,remotePhasesTs),deletados,
      comentarioGestor,comentarioGestorTs:Math.max(localComentTs,remoteComentTs)};
  }
  const doUpsert=()=>db.from('cronograma_state')
    .upsert({id:1,data:toSave,updated_at:new Date().toISOString()});
  let {error}=await doUpsert();
  if(error&&isAuthError(error)){
    await recoverAuth();
    ({error}=await doUpsert());
  }
  if(error){ toast('Não deu para salvar no servidor: '+error.message); return false; }
  return true;
}
function save(){
  const snapshot=state;
  clearTimeout(saveT);
  saveT=setTimeout(()=>saveNow(snapshot),350);
}
// Salvamento periódico de segurança: garante persistência mesmo se algum
// fluxo de edição não tiver chamado save() corretamente
setInterval(()=>saveNow(state),60000);

/* ============================ autenticação ============================ */
const LASTSEEN_KEY='cronograma-planta-lastseen';
const WHOAMI_KEY='cronograma-planta-quemsou';
const SESSION_TTL=10*60*1000;
function touchSession(){
  try{ localStorage.setItem(LASTSEEN_KEY,String(Date.now())); }catch(e){}
}
async function enforceSessionTTL(){
  let last=0;
  try{ last=Number(localStorage.getItem(LASTSEEN_KEY)||0); }catch(e){}
  if(last&&(Date.now()-last)>SESSION_TTL){
    await db.auth.signOut();
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) touchSession(); });
window.addEventListener('pagehide',touchSession);
window.addEventListener('beforeunload',touchSession);
setInterval(touchSession,20000);
async function ensureAuth(){
  await enforceSessionTTL();
  const {data:{session}}=await db.auth.getSession();
  if(session){ touchSession(); return; }
  await showGate();
  touchSession();
}
// Quando um salvamento falha por sessão inválida/expirada (a aba fica
// aberta pra sempre com o salvamento automático de 60 em 60 segundos —
// se a sessão caducar nesse meio tempo, toda tentativa seguinte falhava
// silenciosamente, gerando um erro atrás do outro sem a pessoa nunca
// ficar sabendo), tenta renovar a sessão sozinho; se não der, limpa a
// sessão velha e pede login de novo. O "reauthPromise" evita abrir vários
// gates ao mesmo tempo se mais de um salvamento falhar junto.
let reauthPromise=null;
function isAuthError(error){
  if(!error) return false;
  return error.code==='42501'||error.status===401||/row-level security|JWT/i.test(error.message||'');
}
async function recoverAuth(){
  if(!reauthPromise){
    reauthPromise=(async()=>{
      const {error:refreshErr}=await db.auth.refreshSession();
      if(refreshErr){
        await db.auth.signOut();
        await ensureAuth();
      }
    })();
  }
  try{ await reauthPromise; } finally{ reauthPromise=null; }
}
function showGate(){
  return new Promise(resolve=>{
    let lastName='';
    try{ lastName=localStorage.getItem(WHOAMI_KEY)||''; }catch(e){}
    const scrim=document.createElement('div');scrim.className='scrim';
    const box=document.createElement('div');box.className='drawer gate';
    box.innerHTML=`
      <h3>Acesso restrito</h3>
      <p class="title">Senha da equipe</p>
      <div class="f"><label>Quem é você?</label><input id="gateQuem" list="gateQuemList" placeholder="seu nome" value="${esc(lastName)}">
        <datalist id="gateQuemList">${RESP_SUGESTOES.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      </div>
      <div class="f"><input type="password" id="gatePwd" placeholder="senha"></div>
      <div class="acts"><button class="solid" id="gateGo">Entrar</button></div>
      <p class="gateErr" id="gateErr"></p>`;
    document.body.appendChild(scrim);document.body.appendChild(box);
    const quem=box.querySelector('#gateQuem'),pwd=box.querySelector('#gatePwd'),
          err=box.querySelector('#gateErr'),go=box.querySelector('#gateGo');
    if(lastName) pwd.focus(); else quem.focus();
    async function tryLogin(){
      const quemVal=quem.value.trim();
      if(!quemVal){ err.textContent='Diz quem é você.'; quem.focus(); return; }
      go.disabled=true;err.textContent='';
      const {error}=await db.auth.signInWithPassword({email:SHARED_EMAIL,password:pwd.value});
      if(error){
        err.textContent='Senha incorreta.';
        pwd.value='';pwd.focus();go.disabled=false;
        return;
      }
      try{ localStorage.setItem(WHOAMI_KEY,quemVal); }catch(e){}
      scrim.remove();box.remove();
      resolve();
    }
    go.onclick=tryLogin;
    quem.onkeydown=e=>{ if(e.key==='Enter') pwd.focus(); };
    pwd.onkeydown=e=>{ if(e.key==='Enter') tryLogin(); };
  });
}
// Confere a senha da equipe sem derrubar a sessão atual da aba: abre um
// cliente Supabase à parte, sem persistir sessão, só pra esse teste — e
// descarta em seguida. O login "de verdade" da aba não é afetado.
async function verifyTeamPassword(pwd){
  const check=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {error}=await check.auth.signInWithPassword({email:SHARED_EMAIL,password:pwd});
  return !error;
}
// Gaveta de confirmação de exclusão: pede quem está excluindo (fica no
// histórico) e a senha da equipe de novo, como barreira extra contra clique
// sem querer. Resolve com o nome digitado, ou null se cancelado.
function showDeleteGate(nome){
  return new Promise(resolve=>{
    const scrim=document.createElement('div');scrim.className='scrim';
    const box=document.createElement('div');box.className='drawer gate';
    box.innerHTML=`
      <h3>Excluir atividade</h3>
      <p class="title">${esc(nome)}</p>
      <div class="f"><label>Quem está excluindo?</label><input id="delQuem" list="delQuemList" placeholder="seu nome">
        <datalist id="delQuemList">${RESP_SUGESTOES.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      </div>
      <div class="f"><label>Senha da equipe</label><input type="password" id="delPwd" placeholder="senha"></div>
      <div class="acts"><button class="danger" id="delGo" type="button">Excluir</button><button class="ghost" id="delCancel" type="button">Cancelar</button></div>
      <p class="gateErr" id="delErr"></p>`;
    document.body.appendChild(scrim);document.body.appendChild(box);
    const quem=box.querySelector('#delQuem'),pwd=box.querySelector('#delPwd'),err=box.querySelector('#delErr'),
          go=box.querySelector('#delGo'),cancel=box.querySelector('#delCancel');
    quem.focus();
    function cleanup(){ scrim.remove(); box.remove(); }
    cancel.onclick=()=>{ cleanup(); resolve(null); };
    scrim.onclick=()=>{ cleanup(); resolve(null); };
    async function tryDelete(){
      const quemVal=quem.value.trim();
      if(!quemVal){ err.textContent='Diz quem está excluindo.'; quem.focus(); return; }
      go.disabled=true;err.textContent='';
      const ok=await verifyTeamPassword(pwd.value);
      if(!ok){
        err.textContent='Senha incorreta.';
        pwd.value='';pwd.focus();go.disabled=false;
        return;
      }
      cleanup();
      resolve(quemVal);
    }
    go.onclick=tryDelete;
    quem.onkeydown=e=>{ if(e.key==='Enter') pwd.focus(); };
    pwd.onkeydown=e=>{ if(e.key==='Enter') tryDelete(); };
  });
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3200);
}

/* ============================ intervalo ============================ */
function span(){
  const ds=[];
  state.acts.forEach(a=>{if(a.ini)ds.push(s2d(a.ini));if(a.fim)ds.push(s2d(a.fim))});
  ds.push(today());
  let min=new Date(Math.min(...ds)), max=new Date(Math.max(...ds));
  min=addD(min,-21); max=addD(max,60);
  const pad=Math.max(0,120-diffD(min,max)); max=addD(max,pad);
  return{t0:min,t1:max,days:diffD(min,max)};
}
const X=(t0,d)=>diffD(t0,d)*zoom;

/* ============================ render ============================ */
function render(){
  document.getElementById('stamp').textContent=
    'atualizado '+fmt(d2s(today()))+' · '+state.acts.length+' atividades';
  updateFlowstrip();
  renderStats();
  const m=document.getElementById('main');
  const prevScroller=m.querySelector('.scroller');
  const prevScrollLeft=prevScroller?prevScroller.scrollLeft:null;
  m.innerHTML='';
  m.appendChild(view==='time'?buildTimeline():view==='board'?buildBoard():buildDeleted());
  if(prevScrollLeft!==null){
    const sc=m.querySelector('.scroller');
    if(sc) sc.scrollLeft=prevScrollLeft;
  }
}
function updateFlowstrip(){
  const el=document.querySelector('.flowstrip');
  if(!el||!PHASES.length)return;
  const n=PHASES.length;
  const stops=PHASES.map((p,i)=>`${p.c} ${n>1?(i/(n-1)*100):0}%`).join(', ');
  el.style.background=`linear-gradient(180deg, ${stops})`;
}

// progresso ponderado pelo tamanho (em dias) de cada atividade — usado no
// indicador "Avanço geral" do topo e no resumo em PDF, pra sempre baterem
function overallPct(acts){
  const sched=acts.filter(a=>a.ini&&a.fim);
  const w=sched.reduce((s,a)=>s+Math.max(1,diffD(s2d(a.ini),s2d(a.fim))+1),0);
  const wp=sched.reduce((s,a)=>s+Math.max(1,diffD(s2d(a.ini),s2d(a.fim))+1)*((a.pct||0)/100),0);
  return w?Math.round(wp/w*100):0;
}
function renderStats(){
  const A=state.acts;
  const sched=A.filter(a=>a.ini&&a.fim);
  const pct=overallPct(A);
  const late=A.filter(a=>statusOf(a)==='atrasado');
  const run=A.filter(a=>statusOf(a)==='andamento').length;
  const nod=A.filter(a=>statusOf(a)==='semdata').length;
  const next=sched.filter(a=>(a.pct||0)<100&&s2d(a.fim)>=today())
                  .sort((x,y)=>s2d(x.fim)-s2d(y.fim))[0];
  const worst=late.sort((x,y)=>lateDays(y)-lateDays(x))[0];
  const s=document.getElementById('stats');
  s.innerHTML=`
    <div class="stat wide">
      <div class="k">Avanço geral</div><div class="v">${pct}%</div>
      <div class="meter"><i style="width:${pct}%"></i></div>
    </div>
    <div class="stat ${late.length?'alert':''}">
      <div class="k">Atrasadas</div><div class="v">${late.length}</div>
    </div>
    <div class="stat"><div class="k">Em andamento</div><div class="v">${run}</div></div>
    <div class="stat"><div class="k">Sem data</div><div class="v">${nod}</div></div>
    <div class="stat wide">
      <div class="k">${worst?'Maior atraso':'Próximo prazo'}</div>
      <div class="v" style="font-size:13px;font-weight:500;padding-top:4px">${
        worst?esc(worst.nome)+' · '+lateDays(worst)+'d'
            :(next?esc(next.nome)+' · '+fmt(next.fim):'defina as primeiras datas')}</div>
    </div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// PHASES é a mesma referência de state.phases; a.fase guarda o ÍNDICE do
// grupo na hora. Ao trocar a posição de dois grupos, precisa também trocar
// esse índice em todas as atividades que apontavam pra eles — senão as
// atividades "pulam" de grupo ao reordenar.
function moveGroup(pi,dir){
  const ni=pi+dir;
  if(ni<0||ni>=PHASES.length) return;
  [PHASES[pi],PHASES[ni]]=[PHASES[ni],PHASES[pi]];
  state.acts.forEach(a=>{
    if(a.fase===pi){a.fase=ni;a._ts=Date.now();}
    else if(a.fase===ni){a.fase=pi;a._ts=Date.now();}
  });
  state.phasesTs=Date.now();
  if(collapsedPhases.has(pi)||collapsedPhases.has(ni)){
    const hadPi=collapsedPhases.has(pi), hadNi=collapsedPhases.has(ni);
    if(hadPi) collapsedPhases.add(ni); else collapsedPhases.delete(ni);
    if(hadNi) collapsedPhases.add(pi); else collapsedPhases.delete(pi);
    saveCollapsed();
  }
  save();render();
}
// Move uma atividade pra outro grupo e/ou reordena ela dentro do grupo
// (arrastar a alça até lá e soltar). A ordem de exibição dentro de um
// grupo segue a ordem relativa das atividades daquele grupo dentro do
// array state.acts (o filtro por fase preserva a ordem), então reordenar
// é remover a atividade de onde estava e reinserir logo antes de
// "beforeActId" — sem precisar de um campo de ordem à parte. Sem
// beforeActId, vai pro final (do grupo, já que fica depois de tudo que já
// existia nele no array).
function moveActTo(actId,targetPi,beforeActId){
  if(beforeActId===actId) return; // soltou bem em cima da própria linha: nada a fazer
  const idx=state.acts.findIndex(x=>x.id===actId);
  if(idx===-1) return;
  const [a]=state.acts.splice(idx,1);
  a.fase=targetPi;
  a._ts=Date.now();
  if(beforeActId){
    const insertIdx=state.acts.findIndex(x=>x.id===beforeActId);
    state.acts.splice(insertIdx===-1?state.acts.length:insertIdx,0,a);
  }else{
    state.acts.push(a);
  }
  save();render();
}

function buildTimeline(){
  const {t0,t1,days}=span();
  const W=days*zoom;
  const outer=document.createElement('div');
  outer.className='timelineWrap';
  const railcol=document.createElement('div');
  railcol.className='railcol';
  const wrap=document.createElement('div');
  wrap.className='scroller';
  const track=document.createElement('div');
  track.className='track';
  wrap.appendChild(track);
  outer.appendChild(railcol);
  outer.appendChild(wrap);

  /* cabeçalho */
  const railHead=document.createElement('div');
  railHead.className='railHead';
  railHead.innerHTML=`<span>Atividade</span><div class="railResize" id="railResize" title="Arraste para ajustar a largura desta coluna"></div>`;
  railcol.appendChild(railHead);
  const hl=document.createElement('div');
  hl.className='lane tlhead';hl.style.width=W+'px';hl.style.flex='0 0 '+W+'px';
  let cur=new Date(t0.getFullYear(),t0.getMonth(),1);
  while(cur<t1){
    if(cur>=t0){
      const el=document.createElement('div');
      el.className='mtick';el.style.left=X(t0,cur)+'px';
      el.textContent=MON[cur.getMonth()]+(cur.getMonth()===0||cur.getTime()===t0.getTime()?" '"+String(cur.getFullYear()).slice(2):'');
      hl.appendChild(el);
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  track.appendChild(hl);

  /* linhas de grade + hoje, camada de fundo por faixa */
  const gridHTML=(()=>{
    let h='';
    let c=new Date(t0.getFullYear(),t0.getMonth(),1);
    while(c<t1){
      if(c>=t0) h+=`<div class="gridline month" style="left:${X(t0,c)}px"></div>`;
      c=new Date(c.getFullYear(),c.getMonth()+1,1);
    }
    if(zoom>=8){
      let d=new Date(t0);
      while(d<t1){ if(d.getDay()===1) h+=`<div class="gridline" style="left:${X(t0,d)}px"></div>`; d=addD(d,1); }
      // escala auxiliar de 5 em 5 dias (contando a partir do início visível),
      // pra dar uma referência de distância ao olhar a régua
      let d5=new Date(t0),i5=0;
      while(d5<t1){ if(i5%5===0) h+=`<div class="gridline five" style="left:${X(t0,d5)}px"></div>`; d5=addD(d5,1); i5++; }
    }
    h+=`<div class="today" style="left:${X(t0,today())}px"></div>`;
    return h;
  })();

  let total=0;
  PHASES.forEach((ph,pi)=>{
    let list=state.acts.filter(a=>a.fase===pi);
    if(onlyLate) list=list.filter(a=>statusOf(a)==='atrasado');
    if(onlyLate&&!list.length) return;
    total+=list.length;

    const collapsed=collapsedPhases.has(pi);
    const done=list.filter(a=>(a.pct||0)>=100).length;
    const melhorTotal=melhorTotalDoGrupo(list);
    const pr=document.createElement('div');
    pr.className='phaseRail';pr.dataset.pi=pi;
    pr.innerHTML=`<button class="collapseBtn" aria-expanded="${!collapsed}" title="${collapsed?'Expandir grupo':'Recolher grupo'}">▾</button>
        <span class="moveGrp">
          <button class="moveBtn" data-dir="-1" title="Mover grupo para cima" ${pi===0?'disabled':''}>▲</button>
          <button class="moveBtn" data-dir="1" title="Mover grupo para baixo" ${pi===PHASES.length-1?'disabled':''}>▼</button>
        </span>
        <span class="chip" style="background:${ph.c}"></span>
        <h2 title="Clique para renomear">${esc(ph.n)}</h2>
        ${melhorTotal>0?`<span class="cnt cntMoney" title="Soma dos melhores orçamentos do grupo">${fmtMoneyNum(melhorTotal)}</span>`:''}
        <span class="cnt">${done}/${list.length}</span>`;
    pr.querySelector('.collapseBtn').onclick=()=>{
      if(collapsed) collapsedPhases.delete(pi); else collapsedPhases.add(pi);
      saveCollapsed();render();
    };
    pr.querySelectorAll('.moveBtn').forEach(b=>{
      b.onclick=()=>moveGroup(pi,Number(b.dataset.dir));
    });
    const h2=pr.querySelector('h2');
    h2.onclick=()=>{
      const inp=document.createElement('input');
      inp.className='phaseNameInput';inp.value=ph.n;
      h2.replaceWith(inp);inp.focus();inp.select();
      inp.onkeydown=e=>{
        if(e.key==='Enter'){
          const v=inp.value.trim();
          if(v){ ph.n=v; state.phasesTs=Date.now(); }
          save();render();
        }
        if(e.key==='Escape') render();
      };
      inp.onblur=()=>render();
    };
    railcol.appendChild(pr);
    const pl=document.createElement('div');
    pl.className='lane phaseLane';pl.style.width=W+'px';pl.style.flex='0 0 '+W+'px';
    pl.innerHTML=gridHTML;
    track.appendChild(pl);

    if(collapsed) return;

    list.forEach(a=>{
      const st=statusOf(a);
      const rail=document.createElement('div');
      rail.className='actRail'+(st==='feito'?' done':'');rail.dataset.pi=pi;rail.dataset.actId=a.id;
      const grip=document.createElement('span');
      grip.className='actGrip';grip.draggable=true;grip.title='Arraste para mover para outro grupo';
      grip.innerHTML=GRIP_SVG;
      grip.ondragstart=e=>{ e.dataTransfer.setData('text/plain',a.id); e.dataTransfer.effectAllowed='move'; };
      rail.appendChild(grip);
      const nb=document.createElement('button');
      nb.className='name';nb.textContent=a.nome;nb.title=a.nome;
      nb.onclick=()=>openDrawer(a.id);
      rail.appendChild(nb);
      if(hasAnexo(a)){
        const ic=document.createElement('span');
        ic.className='rowAnexo';ic.title='Tem anexo de orçamento';ic.innerHTML=PAPERCLIP_SVG;
        rail.appendChild(ic);
      }
      if(hasNota(a)){
        const fl=document.createElement('span');
        fl.className='rowNota';
        fl.innerHTML=FLAG_SVG+`<span class="tip">${esc(a.nota)}</span>`;
        rail.appendChild(fl);
      }
      if(a.resp){const w=document.createElement('span');w.className='who';w.textContent=a.resp;rail.appendChild(w)}
      if(st==='semdata'){
        const b=document.createElement('button');
        b.className='setdate';b.textContent='+ data';
        b.onclick=()=>{a.ini=d2s(today());a.fim=d2s(addD(today(),7));a._ts=Date.now();save();render()};
        rail.appendChild(b);
      }
      railcol.appendChild(rail);

      const lane=document.createElement('div');
      lane.className='lane actLane';lane.style.width=W+'px';lane.style.flex='0 0 '+W+'px';
      lane.innerHTML=gridHTML;
      if(a.ini&&a.fim){
        const x=X(t0,s2d(a.ini));
        const dateW=Math.max(zoom*1.2,(diffD(s2d(a.ini),s2d(a.fim))+1)*zoom);
        const iniTxt=fmt(a.ini), fimTxt=fmt(a.fim);
        const minW=textW(iniTxt)+textW(fimTxt)+28;
        const w=Math.max(dateW,minW);
        const bar=document.createElement('div');
        bar.className='bar'+(st==='atrasado'?' late':'');
        bar.style.left=x+'px';bar.style.width=w+'px';
        bar.dataset.id=a.id;
        if(st!=='atrasado'){
          // 100% concluída usa o verde Pluma (--ink, a mesma cor da logo);
          // o resto continua no cinza neutro de sempre
          const barColor=st==='feito'?'var(--ink)':'var(--ink-2)';
          bar.style.borderColor=barColor;
          bar.style.background=st==='feito'?'#163D3422':'#626A6822';
          const f=document.createElement('div');
          f.className='fill';f.style.background=barColor;f.style.width=(a.pct||0)+'%';
          f.style.opacity=st==='feito'?'1':'.85';
          bar.appendChild(f);
        }
        // cor de cada rótulo considera se o preenchimento (fill) já cobre
        // aquele ponto da barra (início ~0%, fim ~95%+)
        const colorAt=posPct=>st==='atrasado'?'#fff':((a.pct||0)>=posPct?'#fff':'#163D34');
        const lbStart=document.createElement('span');
        lbStart.className='lbl lbl-start';lbStart.style.color=colorAt(5);lbStart.textContent=iniTxt;
        bar.appendChild(lbStart);
        const lbEnd=document.createElement('span');
        lbEnd.className='lbl lbl-end';lbEnd.style.color=colorAt(95);lbEnd.textContent=fimTxt;
        bar.appendChild(lbEnd);
        const g=document.createElement('div');g.className='grip';g.dataset.grip='1';bar.appendChild(g);
        lane.appendChild(bar);
        if(st==='atrasado'){
          const ov=document.createElement('div');
          ov.className='overflow';
          ov.style.left=(x+w)+'px';
          ov.style.width=Math.max(3,lateDays(a)*zoom)+'px';
          lane.appendChild(ov);
        }
      }
      track.appendChild(lane);
    });

    if(!onlyLate){
      const rl=document.createElement('div');rl.className='addRail';rl.dataset.pi=pi;
      const btn=document.createElement('button');
      btn.className='addbtn';btn.textContent='+ atividade';
      btn.onclick=()=>{
        rl.innerHTML='';
        const inp=document.createElement('input');
        inp.className='addinput';inp.placeholder='nome da atividade, Enter para criar';
        rl.appendChild(inp);inp.focus();
        inp.onkeydown=e=>{
          if(e.key==='Enter'&&inp.value.trim()){
            state.acts.push({id:uid(),fase:pi,nome:inp.value.trim(),resp:'',ini:'',fim:'',pct:0,nota:'',_ts:Date.now()});
            save();render();
          }
          if(e.key==='Escape') render();
        };
        inp.onblur=()=>render();
      };
      rl.appendChild(btn);
      railcol.appendChild(rl);
      const al=document.createElement('div');
      al.className='lane addLane';al.style.width=W+'px';al.style.flex='0 0 '+W+'px';
      al.innerHTML=gridHTML;
      track.appendChild(al);
    }
  });

  if(!onlyLate){
    const grl=document.createElement('div');grl.className='addRail addgroup';
    const gbtn=document.createElement('button');
    gbtn.className='addbtn';gbtn.textContent='+ novo grupo de atividades';
    gbtn.onclick=()=>{
      grl.innerHTML='';
      const inp=document.createElement('input');
      inp.className='addinput';inp.placeholder='nome do grupo, Enter para criar';
      grl.appendChild(inp);inp.focus();
      inp.onkeydown=e=>{
        if(e.key==='Enter'&&inp.value.trim()){
          PHASES.push({n:inp.value.trim(),c:PALETTE[PHASES.length%PALETTE.length]});
          state.phasesTs=Date.now();
          save();render();
        }
        if(e.key==='Escape') render();
      };
      inp.onblur=()=>render();
    };
    grl.appendChild(gbtn);
    railcol.appendChild(grl);
    const gl=document.createElement('div');
    gl.className='lane addLane addgroup';gl.style.width=W+'px';gl.style.flex='0 0 '+W+'px';
    track.appendChild(gl);
  }

  if(!total){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent=onlyLate?'Nada atrasado. Bom sinal.':'Sem atividades. Use "+ atividade" em qualquer fase.';
    track.appendChild(e);
  }
  // Arrastar a alça (▤) de uma atividade e soltar em qualquer ponto da
  // coluna esquerda move ela pro grupo mais próximo verticalmente do ponto
  // onde soltou — não precisa acertar em cima de uma linha específica.
  // preventDefault roda sempre (não só em cima de uma linha) pra coluna
  // inteira aceitar o solt. Além do grupo, também resolve a posição: se a
  // linha mais próxima for outra atividade, solta acima da metade dela
  // insere antes, abaixo insere depois — permite tanto mover pra outro
  // grupo quanto reordenar dentro do mesmo grupo.
  function resolveDropTarget(clientY){
    const rows=[...railcol.querySelectorAll('[data-pi]')];
    if(!rows.length) return null;
    let best=null,bestDist=Infinity,bestIdx=-1;
    rows.forEach((r,i)=>{
      const rect=r.getBoundingClientRect();
      const dist=Math.abs((rect.top+rect.bottom)/2-clientY);
      if(dist<bestDist){ bestDist=dist; best=r; bestIdx=i; }
    });
    if(!best) return null;
    const targetPi=Number(best.dataset.pi);
    // acha a próxima linha de atividade do mesmo grupo depois de "best",
    // pra usar como "antes de" quando o solt vai depois de "best"
    const nextActInPhase=()=>{
      for(let i=bestIdx+1;i<rows.length;i++){
        if(Number(rows[i].dataset.pi)!==targetPi) return null;
        if(rows[i].dataset.actId) return rows[i].dataset.actId;
      }
      return null;
    };
    let beforeActId=null;
    if(best.classList.contains('actRail')){
      const rect=best.getBoundingClientRect();
      const mid=(rect.top+rect.bottom)/2;
      beforeActId=(clientY<mid)?best.dataset.actId:nextActInPhase();
    }else{
      beforeActId=nextActInPhase();
    }
    return {targetPi,beforeActId};
  }
  let dropPi=null;
  function setDropHighlight(pi){
    if(dropPi===pi) return;
    if(dropPi!==null){
      const old=railcol.querySelector(`.phaseRail[data-pi="${dropPi}"]`);
      if(old) old.classList.remove('dropTarget');
    }
    dropPi=pi;
    if(pi!==null){
      const cur=railcol.querySelector(`.phaseRail[data-pi="${pi}"]`);
      if(cur) cur.classList.add('dropTarget');
    }
  }
  railcol.addEventListener('dragover',e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    const target=resolveDropTarget(e.clientY);
    setDropHighlight(target?target.targetPi:null);
  });
  railcol.addEventListener('dragleave',e=>{
    if(!railcol.contains(e.relatedTarget)) setDropHighlight(null);
  });
  railcol.addEventListener('drop',e=>{
    e.preventDefault();
    const target=resolveDropTarget(e.clientY);
    setDropHighlight(null);
    if(!target) return;
    moveActTo(e.dataTransfer.getData('text/plain'),target.targetPi,target.beforeActId);
  });
  attachDrag(wrap,t0);
  return outer;
}

/* ---------- arrastar ---------- */
function attachDrag(root,t0){
  let drag=null;
  const down=e=>{
    const bar=e.target.closest('.bar');
    if(!bar)return;
    const a=state.acts.find(x=>x.id===bar.dataset.id);
    if(!a)return;
    const pt=e.touches?e.touches[0]:e;
    drag={id:a.id,bar,mode:e.target.dataset.grip?'resize':'move',
          x0:pt.clientX,l0:parseFloat(bar.style.left),w0:parseFloat(bar.style.width),
          ini:a.ini,fim:a.fim,delta:0};
    e.preventDefault();
  };
  const move=e=>{
    if(!drag)return;
    const pt=e.touches?e.touches[0]:e;
    const dd=Math.round((pt.clientX-drag.x0)/zoom);
    drag.delta=dd;
    if(drag.mode==='move') drag.bar.style.left=(drag.l0+dd*zoom)+'px';
    else drag.bar.style.width=Math.max(zoom,drag.w0+dd*zoom)+'px';
    e.preventDefault();
  };
  // Relê a atividade em "state.acts" pelo id (em vez de usar um objeto
  // capturado no mousedown): se uma sincronização em tempo real trocar
  // "state" inteiro durante o arraste, o objeto antigo vira uma referência
  // órfã e a edição se perderia silenciosamente — mesma causa do bug na
  // gaveta de edição.
  const up=()=>{
    if(!drag)return;
    const {id,mode,delta,ini,fim}=drag;
    const a=state.acts.find(x=>x.id===id);
    if(a&&delta!==0){
      if(mode==='move'){a.ini=d2s(addD(s2d(ini),delta));a.fim=d2s(addD(s2d(fim),delta))}
      else{
        let nf=addD(s2d(fim),delta);
        if(nf<s2d(a.ini)) nf=s2d(a.ini);
        a.fim=d2s(nf);
      }
      a._ts=Date.now();
      save();render();
    }
    drag=null;
  };
  root.addEventListener('mousedown',down);
  root.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
}

/* ---------- quadro ---------- */
function buildBoard(){
  const cols=[
    {k:'fazer', t:'A fazer',    f:a=>['previsto','semdata'].includes(statusOf(a)), pct:0},
    {k:'fazendo',t:'Fazendo',   f:a=>['andamento','atrasado'].includes(statusOf(a)), pct:50},
    {k:'feito', t:'Feito',      f:a=>statusOf(a)==='feito', pct:100},
  ];
  const b=document.createElement('div');
  b.className='board';
  cols.forEach(c=>{
    let list=state.acts.filter(c.f);
    if(onlyLate) list=list.filter(a=>statusOf(a)==='atrasado');
    const col=document.createElement('div');
    col.className='col';col.dataset.pct=c.pct;
    col.innerHTML=`<h3>${c.t}<span>${list.length}</span></h3>`;
    list.forEach(a=>{
      const st=statusOf(a);
      const card=document.createElement('div');
      card.className='card'+(st==='atrasado'?' late':'');
      card.style.borderLeftColor=PHASES[a.fase].c;
      card.draggable=true;
      card.dataset.id=a.id;
      card.innerHTML=`<div class="t">${esc(a.nome)}${hasAnexo(a)?` <span class="cardAnexo" title="Tem anexo de orçamento">${PAPERCLIP_SVG}</span>`:''}${hasNota(a)?` <span class="cardNota">${FLAG_SVG}<span class="tip">${esc(a.nota)}</span></span>`:''}</div>
        <div class="m"><span>${esc(PHASES[a.fase].n)}</span>
        ${a.resp?'<span>'+esc(a.resp)+'</span>':''}
        <span class="${st==='atrasado'?'d':''}">${st==='atrasado'?lateDays(a)+'d de atraso':(a.fim?'até '+fmt(a.fim):'sem data')}</span></div>`;
      card.onclick=()=>openDrawer(a.id);
      card.ondragstart=e=>{e.dataTransfer.setData('text/plain',a.id)};
      col.appendChild(card);
    });
    col.ondragover=e=>{e.preventDefault();col.classList.add('over')};
    col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{
      e.preventDefault();col.classList.remove('over');
      const a=state.acts.find(x=>x.id===e.dataTransfer.getData('text/plain'));
      if(!a)return;
      a.pct=Number(col.dataset.pct);
      if(a.pct>0&&!a.ini){a.ini=d2s(today());a.fim=d2s(addD(today(),7))}
      a._ts=Date.now();
      save();render();
    };
    b.appendChild(col);
  });
  return b;
}

/* ---------- excluídos ---------- */
function fmtDateTime(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function buildDeleted(){
  const list=(state.deletados||[]).slice()
    .sort((x,y)=>new Date(y.excluidoEm)-new Date(x.excluidoEm));
  if(!list.length){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='Nenhuma atividade excluída ainda.';
    return e;
  }
  const wrap=document.createElement('div');
  wrap.innerHTML=list.map(x=>`
    <div class="delRow">
      <span class="t">${esc(x.nome)}</span>
      <span class="m">${esc(x.fase||'—')}</span>
      <span class="m">excluído por ${esc(x.excluidoPor||'—')}</span>
      <span class="m">${fmtDateTime(x.excluidoEm)}</span>
    </div>`).join('');
  return wrap;
}

/* ---------- gaveta ---------- */
function openDrawer(id){
  closeDrawer();
  const a=state.acts.find(x=>x.id===id);
  if(!a)return;
  editing=id;
  // começa com pelo menos 3 linhas (ou mais, se a atividade já tiver sido
  // salva com linhas extras adicionadas via "+ linha"). cotCount cresce
  // conforme se adiciona linha; cotAnexos guarda o anexo de cada uma,
  // separado dos inputs de texto — upload/remoção salvam na hora (não
  // esperam o botão Salvar), então precisam de um lugar pra viver que
  // sobreviva a re-render da célula sem depender do DOM
  let cotCount=Math.max(3,(a.cotacoes&&a.cotacoes.length)||0);
  let cotAnexos=[];
  for(let i=0;i<cotCount;i++) cotAnexos.push((a.cotacoes&&a.cotacoes[i]&&a.cotacoes[i].anexo)||null);
  function attachCellHTML(i){
    const anexo=cotAnexos[i];
    if(!anexo) return `<span class="cotAttach" data-i="${i}">
        <button type="button" class="cotPick" data-i="${i}" title="Anexar arquivo">${PAPERCLIP_SVG}</button>
        <input type="file" class="cotFile" data-i="${i}" style="display:none">
      </span>`;
    return `<span class="cotAttach" data-i="${i}">
        <button type="button" class="cotOpen" data-i="${i}" title="${esc(anexo.nome)}">${PAPERCLIP_SVG}<span class="fn">${esc(anexo.nome)}</span></button>
        <button type="button" class="cotRm" data-i="${i}" title="Remover anexo">×</button>
        <input type="file" class="cotFile" data-i="${i}" style="display:none">
      </span>`;
  }
  // Alterna o bloco inteiro entre "orçamentos" (fornecedor + valor) e
  // "documentos" (um campo único mais largo, sem valor — não faz sentido
  // pedir preço de um anexo qualquer que não é cotação de fornecedor).
  // Troca tudo de uma vez, não linha por linha.
  let cotModo=a.cotModo==='documento'?'documento':'orcamento';
  // se já tem uma escolha salva, trata como manual (não sobrescreve
  // silenciosamente uma decisão que a pessoa já tomou antes); sem escolha
  // salva ainda, o "menor valor" é selecionado sozinho assim que os
  // valores forem preenchidos
  let melhorManual=!!(a.melhorOrcamento);
  function cotHeadHTML(){
    return cotModo==='documento'
      ?`<span>Documento</span><span></span>`
      :`<span>Fornecedor</span><span>Valor</span><span></span>`;
  }
  function cotRowHTML(i,forn,valor){
    if(cotModo==='documento') return `<input type="text" class="cotForn" data-i="${i}" placeholder="documento" value="${esc(forn||'')}">
            ${attachCellHTML(i)}`;
    return `<input type="text" class="cotForn" data-i="${i}" placeholder="fornecedor" value="${esc(forn||'')}">
            <input type="text" class="cotValor" data-i="${i}" placeholder="valor" value="${esc(fmtMoney(valor||''))}">
            ${attachCellHTML(i)}`;
  }
  // opções do "Melhor orçamento": os fornecedores já digitados nas linhas
  // acima (só faz sentido em modo orçamento — documento não tem cotação
  // pra comparar). Usado tanto no HTML inicial (a partir de a.cotacoes)
  // quanto depois, ao vivo, pra manter em sincronia com o que a pessoa
  // digita (ver refreshMelhorOptions mais abaixo).
  function melhorOptionsHTML(selecionado){
    return Array.from({length:cotCount},(_,i)=>{
      const forn=(a.cotacoes&&a.cotacoes[i]&&a.cotacoes[i].forn)||'';
      if(!forn) return '';
      return `<option value="${i}" ${forn===selecionado?'selected':''}>${esc(forn)}</option>`;
    }).join('');
  }
  const scrim=document.createElement('div');scrim.className='scrim';scrim.onclick=closeDrawer;
  const d=document.createElement('div');d.className='drawer';
  d.innerHTML=`
    <h3>Editar atividade</h3>
    <div class="f"><label>Atividade</label><input id="fNome" value="${esc(a.nome)}"></div>
    <div class="f"><label>Fase</label><select id="fFase">${
      PHASES.map((p,i)=>`<option value="${i}" ${i===a.fase?'selected':''}>${esc(p.n)}</option>`).join('')}</select></div>
    <div class="f"><label for="fResp">Responsável</label><input id="fResp" value="${esc(a.resp||'')}" placeholder="quem toca isso"></div>
    <div class="f"><label>Início (dd/mm/aaaa)</label><input id="fIni" placeholder="dd/mm/aaaa" value="${esc(isoToBR(a.ini))}"></div>
    <div class="f"><label>Prazo (dd/mm/aaaa)</label><input id="fFim" placeholder="dd/mm/aaaa" value="${esc(isoToBR(a.fim))}"></div>
    <div class="f"><label>Andamento</label><div class="pcts" id="fPct">
      ${[0,25,50,75,100].map(v=>`<button type="button" data-v="${v}" aria-pressed="${(a.pct||0)===v}">${v}%</button>`).join('')}
    </div></div>
    <div class="f"><label>Arquivos</label>
      <div class="cotModeSeg" id="fCotMode">
        <button type="button" data-m="orcamento" aria-pressed="${cotModo==='orcamento'}">Orçamentos</button>
        <button type="button" data-m="documento" aria-pressed="${cotModo==='documento'}">Documentos</button>
      </div>
      <div class="cotHead${cotModo==='documento'?' docMode':''}" id="fCotHead">${cotHeadHTML()}</div>
      <div class="cotGrid${cotModo==='documento'?' docMode':''}" id="fCot">${Array.from({length:cotCount},(_,i)=>{
        const c=(a.cotacoes&&a.cotacoes[i])||{};
        return cotRowHTML(i,c.forn,c.valor);
      }).join('')}</div>
      <button type="button" class="addbtn" id="fCotAdd">+ linha</button>
    </div>
    <div class="f" id="fMelhorWrap" style="${cotModo==='documento'?'display:none':''}">
      <label for="fMelhor">Melhor orçamento</label>
      <select id="fMelhor">
        <option value="">— nenhum selecionado —</option>
        ${melhorOptionsHTML(a.melhorOrcamento||'')}
      </select>
    </div>
    <div class="f"><label>Observação</label><textarea id="fNota" placeholder="o que trava, o que falta">${esc(a.nota||'')}</textarea></div>
    <div class="acts">
      <button class="solid" id="fSave" type="button">Salvar</button>
      <button class="ghost" id="fClear" type="button">Limpar</button>
      <button class="danger" id="fDel" type="button">Excluir</button>
    </div>`;
  document.body.appendChild(scrim);document.body.appendChild(d);
  // máscara: digitando só números (ex: 22102026) as barras dd/mm/aaaa
  // aparecem sozinhas, sem precisar digitar "/". Ao apagar bem em cima de uma
  // barra ela pode reaparecer sozinha (limitação aceitável) — pra corrigir um
  // pedaço da data, apague os dígitos, não a barra.
  const maskDate=el=>el.addEventListener('input',()=>{
    const pos=el.selectionStart;
    const digitsBefore=el.value.slice(0,pos).replace(/\D/g,'').length;
    const digits=el.value.replace(/\D/g,'').slice(0,8);
    if(digits.length>4) el.value=digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
    else if(digits.length>2) el.value=digits.slice(0,2)+'/'+digits.slice(2);
    else el.value=digits;
    let newPos=digitsBefore;
    if(digitsBefore>2) newPos++;
    if(digitsBefore>4) newPos++;
    el.setSelectionRange(newPos,newPos);
  });
  maskDate(d.querySelector('#fIni'));
  maskDate(d.querySelector('#fFim'));
  // Linhas de orçamento podem crescer (botão "+ linha"), então máscara de
  // dinheiro e Enter usam delegação de evento no container inteiro (#fCot)
  // em vez de vincular em cada input — assim funcionam em linhas novas
  // automaticamente, sem precisar religar nada quando uma é adicionada.
  const fCot=d.querySelector('#fCot');
  // máscara: aplica fmtMoney a cada tecla (ponto de milhar automático,
  // vírgula pra centavos se a pessoa digitar uma). O cursor é reposicionado
  // contando quantos dígitos/vírgula existiam antes dele (ignorando "R$ " e
  // os pontos de milhar, que são inseridos automaticamente) e andando esse
  // tanto na string já formatada — mesma ideia do maskDate acima. Apagar
  // tudo deixa o campo vazio de verdade, pra dar pra limpar o valor.
  fCot.addEventListener('input',e=>{
    const el=e.target.closest('.cotValor');
    if(!el)return;
    const contentBefore=el.value.slice(0,el.selectionStart).replace(/[^\d,]/g,'').length;
    const formatted=fmtMoney(el.value);
    el.value=formatted;
    if(!formatted) return;
    let count=0,newPos=3;
    for(const ch of formatted.slice(3)){
      if(count>=contentBefore) break;
      newPos++;
      if(ch!=='.') count++;
    }
    el.setSelectionRange(newPos,newPos);
    autoPickMelhor();
  });
  // Enter desce Fornecedor -> Valor -> próxima linha (ou só Documento ->
  // próxima linha, em modo documento), na ordem em que os campos aparecem
  // no DOM; da última linha, vai pro Melhor orçamento.
  fCot.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const cur=e.target.closest('.cotForn,.cotValor');
    if(!cur)return;
    e.preventDefault();
    const focusables=[...fCot.querySelectorAll('.cotForn,.cotValor')];
    const idx=focusables.indexOf(cur);
    if(idx>=0&&idx<focusables.length-1) focusables[idx+1].focus();
    else d.querySelector('#fMelhor').focus();
  });
  // mantém as opções do "Melhor orçamento" em sincronia com o que a
  // pessoa digita nas linhas de fornecedor, e puxa o de menor valor
  // automaticamente (enquanto não houver escolha manual — ver melhorManual)
  fCot.addEventListener('input',e=>{
    if(e.target.closest('.cotForn')){ refreshMelhorOptions(); autoPickMelhor(); }
  });
  // "+ linha": adiciona mais uma linha (fornecedor/valor, ou documento,
  // conforme o modo atual) além das 3 iniciais.
  d.querySelector('#fCotAdd').onclick=()=>{
    const i=cotCount;
    cotCount++;
    cotAnexos.push(null);
    fCot.insertAdjacentHTML('beforeend',cotRowHTML(i));
    fCot.querySelector(`.cotForn[data-i="${i}"]`).focus();
    refreshMelhorOptions();
    autoPickMelhor();
  };
  // Reconstrói as opções do select "Melhor orçamento" a partir do que
  // está digitado agora nas linhas de fornecedor (mantém a seleção atual
  // se a opção ainda existir); esconde o campo inteiro em modo documento,
  // já que não faz sentido escolher "melhor orçamento" entre documentos.
  function refreshMelhorOptions(){
    const wrap=d.querySelector('#fMelhorWrap');
    if(!wrap) return;
    if(cotModo==='documento'){ wrap.style.display='none'; return; }
    wrap.style.display='';
    const sel=d.querySelector('#fMelhor');
    const curVal=sel.value;
    const opts=[...fCot.querySelectorAll('.cotForn')]
      .map((el,i)=>({i,nome:el.value.trim()})).filter(o=>o.nome);
    sel.innerHTML='<option value="">— nenhum selecionado —</option>'+
      opts.map(o=>`<option value="${o.i}">${esc(o.nome)}</option>`).join('');
    if([...sel.options].some(o=>o.value===curVal)) sel.value=curVal;
  }
  // Puxa sozinho o fornecedor de menor valor como "melhor orçamento",
  // sempre que a pessoa ainda não tiver escolhido manualmente (ver
  // melhorManual acima e o listener de "change" no #fMelhor mais abaixo,
  // que marca a escolha como manual assim que a pessoa mexe no select).
  function autoPickMelhor(){
    if(melhorManual||cotModo==='documento') return;
    const forns=[...fCot.querySelectorAll('.cotForn')];
    const valores=[...fCot.querySelectorAll('.cotValor')];
    let bestI=null,bestV=Infinity;
    forns.forEach((el,i)=>{
      if(!el.value.trim()) return;
      const v=parseMoneyValue(valores[i]&&valores[i].value);
      if(v===null||v<=0||v>=bestV) return;
      bestV=v;bestI=i;
    });
    if(bestI===null) return;
    const sel=d.querySelector('#fMelhor');
    if([...sel.options].some(o=>o.value===String(bestI))) sel.value=String(bestI);
  }
  // Alterna o modo do bloco inteiro: reconstrói cabeçalho e linhas de uma
  // vez, preservando o texto já digitado em "Fornecedor"/"Documento" (é o
  // mesmo campo, só muda o que ele representa); o Valor não sobrevive à
  // troca de modo, já que não existe em modo documento.
  d.querySelector('#fCotMode').addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b)return;
    const novoModo=b.dataset.m;
    if(novoModo===cotModo)return;
    const forns=Array.from({length:cotCount},(_,i)=>{
      const el=fCot.querySelector(`.cotForn[data-i="${i}"]`);
      return el?el.value:'';
    });
    cotModo=novoModo;
    [...d.querySelectorAll('#fCotMode button')].forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===cotModo)));
    const cotHead=d.querySelector('#fCotHead');
    cotHead.className='cotHead'+(cotModo==='documento'?' docMode':'');
    cotHead.innerHTML=cotHeadHTML();
    fCot.className='cotGrid'+(cotModo==='documento'?' docMode':'');
    fCot.innerHTML=Array.from({length:cotCount},(_,i)=>cotRowHTML(i,forns[i])).join('');
    refreshMelhorOptions();
    autoPickMelhor();
  });

  // anexos: clipe -> abre o seletor de arquivo escondido; ao escolher,
  // envia pro Storage e já salva a referência na hora (não espera o botão
  // Salvar) — assim o anexo não se perde se a pessoa fechar a gaveta sem
  // clicar em Salvar. Como isso salva tudo junto (via syncCurFromFields,
  // mais abaixo), o que já estava digitado nos outros campos vai junto.
  function renderAttachCell(i){
    const cell=fCot.querySelector(`.cotAttach[data-i="${i}"]`);
    if(cell) cell.outerHTML=attachCellHTML(i);
  }
  fCot.addEventListener('click',async e=>{
    const pick=e.target.closest('.cotPick');
    if(pick){ fCot.querySelector(`.cotFile[data-i="${pick.dataset.i}"]`).click(); return; }
    const openBtn=e.target.closest('.cotOpen');
    if(openBtn){
      const i=Number(openBtn.dataset.i);
      const anexo=cotAnexos[i];
      if(!anexo) return;
      openBtn.disabled=true;
      const {data,error}=await db.storage.from(ATTACH_BUCKET).createSignedUrl(anexo.path,60);
      openBtn.disabled=false;
      if(error){ toast('Não deu para abrir o anexo: '+error.message); return; }
      window.open(data.signedUrl,'_blank');
      return;
    }
    const rm=e.target.closest('.cotRm');
    if(rm){
      const i=Number(rm.dataset.i);
      const anexo=cotAnexos[i];
      if(!anexo) return;
      if(!confirm('Remover o anexo "'+anexo.nome+'"?')) return;
      rm.disabled=true;
      await db.storage.from(ATTACH_BUCKET).remove([anexo.path]);
      cotAnexos[i]=null;
      renderAttachCell(i);
      await commitAnexoChange();
      return;
    }
  });
  fCot.addEventListener('change',async e=>{
    const file=e.target.closest('.cotFile');
    if(!file||!file.files[0]) return;
    const i=Number(file.dataset.i);
    const picked=file.files[0];
    const cell=fCot.querySelector(`.cotAttach[data-i="${i}"]`);
    cell.innerHTML='<span class="cotUploading">enviando…</span>';
    const path=`${id}/cot${i}/${Date.now()}-${sanitizeFilename(picked.name)}`;
    const {error:upErr}=await db.storage.from(ATTACH_BUCKET).upload(path,picked);
    if(upErr){ toast('Não deu para enviar o anexo: '+upErr.message); renderAttachCell(i); return; }
    cotAnexos[i]={path,nome:picked.name};
    renderAttachCell(i);
    await commitAnexoChange();
  });

  let pct=a.pct||0;
  d.querySelector('#fPct').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    pct=Number(b.dataset.v);
    [...d.querySelectorAll('#fPct button')].forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.v)===pct));
  };
  // Limpa só o que costuma ser preenchido no dia a dia (responsável, datas,
  // andamento, orçamentos, melhor orçamento, observação) — mantém nome e
  // fase, que identificam a atividade
  d.querySelector('#fClear').onclick=()=>{
    d.querySelector('#fResp').value='';
    d.querySelector('#fIni').value='';
    d.querySelector('#fFim').value='';
    [...d.querySelectorAll('.cotForn,.cotValor')].forEach(x=>x.value='');
    melhorManual=false;
    d.querySelector('#fMelhor').value='';
    refreshMelhorOptions();
    d.querySelector('#fNota').value='';
    pct=0;
    [...d.querySelectorAll('#fPct button')].forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.v)===0));
    d.querySelector('#fResp').focus();
  };
  const saveBtn=d.querySelector('#fSave');
  // Relê a atividade em "state.acts" pelo id em vez de usar "a" (capturado
  // quando a gaveta abriu): a sincronização em tempo real troca "state"
  // inteiro a cada atualização (inclusive o salvamento periódico automático
  // a cada 60s, sem ninguém mexer em nada) — se isso acontecer com a gaveta
  // aberta, "a" vira uma referência órfã, fora do novo "state.acts". Salvar
  // em cima dela não tinha efeito nenhum: a gaveta fechava como se tivesse
  // dado certo, mas nada do que foi digitado ia para o servidor.
  //
  // Compartilhada entre o botão Salvar e as ações de anexo (que salvam na
  // hora, sem esperar o Salvar) — assim os dois caminhos gravam os campos
  // exatamente do mesmo jeito, sem duplicar a leitura de cada input.
  function syncCurFromFields(cur){
    cur.nome=d.querySelector('#fNome').value.trim()||cur.nome;
    cur.fase=Number(d.querySelector('#fFase').value);
    const respRaw=d.querySelector('#fResp').value.trim();
    cur.resp=respRaw?respRaw.charAt(0).toUpperCase()+respRaw.slice(1):respRaw;
    cur.ini=parseDateField(d.querySelector('#fIni').value,cur.ini);
    cur.fim=parseDateField(d.querySelector('#fFim').value,cur.fim);
    if(cur.ini&&cur.fim&&s2d(cur.fim)<s2d(cur.ini)) cur.fim=cur.ini;
    cur.pct=pct;
    cur.cotModo=cotModo;
    cur.cotacoes=Array.from({length:cotCount},(_,i)=>({
      forn:fCot.querySelector(`.cotForn[data-i="${i}"]`).value.trim(),
      valor:cotModo==='documento'?'':fCot.querySelector(`.cotValor[data-i="${i}"]`).value.trim(),
      anexo:cotAnexos[i]||null
    }));
    const fMelhor=d.querySelector('#fMelhor');
    const melhorForn=fMelhor&&fMelhor.value
      ?fCot.querySelector(`.cotForn[data-i="${fMelhor.value}"]`):null;
    cur.melhorOrcamento=melhorForn?melhorForn.value.trim():'';
    cur.nota=d.querySelector('#fNota').value;
    cur._ts=Date.now();
  }
  // Usada pelo clipe (upload/remoção de anexo): salva na hora, sem fechar a
  // gaveta, pra dar pra continuar anexando nas outras linhas.
  async function commitAnexoChange(){
    const cur=state.acts.find(x=>x.id===id);
    if(!cur){ toast('Esta atividade não existe mais.'); return false; }
    syncCurFromFields(cur);
    const ok=await saveNow(state);
    if(!ok) toast('Não deu para salvar o anexo: tente de novo.');
    return ok;
  }
  // Só fecha a caixa depois que o servidor confirmar a gravação de verdade.
  // Se falhar, a caixa continua aberta com o que foi digitado — nada se perde
  // e um alerta explica o motivo, em vez de fechar silenciosamente sem salvar.
  async function doSave(){
    const cur=state.acts.find(x=>x.id===id);
    if(!cur){ toast('Esta atividade não existe mais.'); closeDrawer(); return; }
    saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    syncCurFromFields(cur);
    const ok=await saveNow(state);
    if(ok){ closeDrawer(); render(); }
    else { saveBtn.disabled=false; saveBtn.textContent='Salvar'; }
  }
  saveBtn.onclick=doSave;
  d.querySelector('#fDel').onclick=async()=>{
    const alvo=state.acts.find(x=>x.id===id);
    if(!alvo){ toast('Esta atividade não existe mais.'); closeDrawer(); return; }
    const quem=await showDeleteGate(alvo.nome);
    if(!quem) return;
    state.acts=state.acts.filter(x=>x.id!==id);
    state.deletados=state.deletados||[];
    state.deletados.push({
      id:alvo.id,nome:alvo.nome,fase:(PHASES[alvo.fase]&&PHASES[alvo.fase].n)||'',
      resp:alvo.resp||'',ini:alvo.ini||'',fim:alvo.fim||'',pct:alvo.pct||0,
      link:alvo.link||'',nota:alvo.nota||'',
      excluidoPor:quem,excluidoEm:new Date().toISOString()
    });
    const ok=await saveNow(state,{deletedIds:new Set([id])});
    if(ok){ closeDrawer(); render(); toast('Atividade excluída'); }
    else{ toast('Não deu para excluir: tente de novo.'); }
  };
  // Enter desce de campo em campo (Atividade → Responsável → Início → Prazo
  // → Fornecedor/Valor das linhas de orçamento → Link); do Link, Enter vai
  // pro botão Salvar — só ali (ou clicando) é que salva de verdade e fecha a
  // caixa. Assim dá pra preencher tudo só pelo teclado sem fechar a caixa
  // sem querer no meio do preenchimento. Fica de fora dessa cadeia só a
  // Observação (textarea), onde Enter precisa continuar quebrando linha.
  // (A parte de dentro do bloco de orçamento é tratada por delegação de
  // evento lá em cima, pra funcionar com qualquer quantidade de linhas.)
  const goNext=(fromSel,toSel)=>{
    d.querySelector(fromSel).addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      d.querySelector(toSel).focus();
    });
  };
  goNext('#fNome','#fResp');
  goNext('#fResp','#fIni');
  goNext('#fIni','#fFim');
  goNext('#fFim','.cotForn[data-i="0"]');
  d.querySelector('#fMelhor').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    saveBtn.focus();
  });
  // qualquer interação de verdade da pessoa com o select vira uma escolha
  // manual, que passa a ser respeitada (não é mais sobrescrita sozinha) —
  // setar .value por código, como o autoPickMelhor faz, não dispara isso
  d.querySelector('#fMelhor').addEventListener('change',()=>{ melhorManual=true; });
  // já entra com o de menor valor selecionado, se ainda não houver
  // escolha manual salva e os valores já estiverem preenchidos
  autoPickMelhor();
  d.querySelector('#fNome').focus();
  document.addEventListener('keydown',escClose);
}
function escClose(e){if(e.key==='Escape')closeDrawer()}
function closeDrawer(){
  document.querySelectorAll('.scrim,.drawer').forEach(x=>x.remove());
  document.removeEventListener('keydown',escClose);
  editing=null;
}

/* ---------- csv ---------- */
function exportCSV(){
  const rows=[['Fase','Atividade','Responsável','Início','Prazo','%','Status','Dias de atraso','Observação']];
  state.acts.forEach(a=>rows.push([
    PHASES[a.fase].n,a.nome,a.resp||'',a.ini||'',a.fim||'',(a.pct||0),
    statusOf(a),lateDays(a),(a.nota||'').replace(/\n/g,' ')
  ]));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const a=document.createElement('a');
  a.href=url;a.download='cronograma-'+d2s(today())+'.csv';a.click();
  URL.revokeObjectURL(url);
}

/* ---------- resumo PDF ---------- */
// Pede/edita o comentário do gestor antes de gerar (fica salvo em
// state.comentarioGestor, sincronizado como o resto dos dados — não
// precisa reescrever a cada relatório, só ajustar quando quiser). Resolve
// com o texto, ou null se cancelado.
function showGestorGate(){
  return new Promise(resolve=>{
    const scrim=document.createElement('div');scrim.className='scrim';
    const box=document.createElement('div');box.className='drawer gate wide';
    box.innerHTML=`
      <h3>Resumo PDF</h3>
      <p class="title">Comentário do gestor</p>
      <div class="f"><textarea id="gestorTxt" placeholder="Observações gerais sobre o andamento do projeto, pra aparecer no relatório">${esc(state.comentarioGestor||'')}</textarea></div>
      <div class="acts"><button class="solid" id="gestorGo" type="button">Gerar PDF</button><button class="ghost" id="gestorCancel" type="button">Cancelar</button></div>`;
    document.body.appendChild(scrim);document.body.appendChild(box);
    const txt=box.querySelector('#gestorTxt'),go=box.querySelector('#gestorGo'),cancel=box.querySelector('#gestorCancel');
    txt.focus();txt.setSelectionRange(txt.value.length,txt.value.length);
    function cleanup(){ scrim.remove(); box.remove(); }
    cancel.onclick=()=>{ cleanup(); resolve(null); };
    scrim.onclick=()=>{ cleanup(); resolve(null); };
    go.onclick=async()=>{
      go.disabled=true;go.textContent='Gerando...';
      const val=txt.value;
      if(val!==(state.comentarioGestor||'')){
        state.comentarioGestor=val;
        state.comentarioGestorTs=Date.now();
        await saveNow(state);
      }
      cleanup();
      resolve(val);
    };
  });
}
// Monta uma página condensada (donut de status, comentário do gestor,
// avanço por grupo em barras, atrasadas e em andamento) em vez de listar
// as ~100 atividades uma a uma — o objetivo é caber a leitura em 1-2
// páginas. Limita cada lista a um tamanho razoável (com uma linha "+N não
// listadas") pra não estourar isso caso um dia existam muitas
// atrasadas/em andamento ao mesmo tempo. Usa o diálogo de impressão do
// navegador (sem biblioteca de PDF): a pessoa escolhe "Salvar como PDF"
// no destino. O donut é CSS puro (conic-gradient), sem lib de gráfico.
const PDF_LIST_MAX=20;
// Roteiro fixo do projeto (marcos de alto nível, não vem de state.acts —
// é a mesma linha do tempo apresentada em slides pro grupo/diretoria).
// Alterna acima/abaixo da linha, na ordem em que aparece aqui.
const ROADMAP=[
  {t:'Neutralizar sabor',pos:'top'},
  {t:'Validar Planta piloto',pos:'bottom'},
  {t:'Definir do local da fábrica',pos:'top'},
  {t:'Definir Layout da fábrica',pos:'bottom'},
  {t:'Orçamento dos equipamentos',pos:'top'},
  {t:'Definir Equipamentos',pos:'bottom'},
  {t:'Equalizar propostas',pos:'top'},
  {t:'Início das negociações',pos:'bottom'},
  {t:'Início das obras',pos:'top'},
  {t:'Final das obras',pos:'bottom'},
  {t:'Início da operação',pos:'top'},
];
function buildRoadmapHTML(){
  const n=ROADMAP.length;
  const edgeClass=i=>i===0?' edge-l':(i===n-1?' edge-r':'');
  const top=ROADMAP.map(m=>`<div class="pdfRoadLbl top">${m.pos==='top'?esc(m.t):''}</div>`).join('');
  const dots=ROADMAP.map((m,i)=>`<div class="pdfRoadDotCell${edgeClass(i)}"><span class="pdfRoadDot"></span></div>`).join('');
  const bottom=ROADMAP.map(m=>`<div class="pdfRoadLbl bottom">${m.pos==='bottom'?esc(m.t):''}</div>`).join('');
  return `<div class="pdfSection">
    <h2>Roteiro do projeto</h2>
    <div class="pdfRoadmap">
      <div class="pdfRoadGrid" style="grid-template-columns:repeat(${n},1fr)">${top}${dots}${bottom}</div>
    </div>
  </div>`;
}
function buildPDFSummary(comentario){
  const A=state.acts;
  const total=A.length||1;
  const feito=A.filter(a=>statusOf(a)==='feito');
  const late=A.filter(a=>statusOf(a)==='atrasado').sort((x,y)=>lateDays(y)-lateDays(x));
  const running=A.filter(a=>statusOf(a)==='andamento').sort((x,y)=>{
    if(!x.fim) return 1;
    if(!y.fim) return -1;
    return s2d(x.fim)-s2d(y.fim);
  });
  const outras=A.length-feito.length-late.length-running.length;
  const pFeito=Math.round(feito.length/total*100);
  const pAnd=Math.round(running.length/total*100);
  const pAtr=Math.round(late.length/total*100);
  const pOut=Math.max(0,100-pFeito-pAnd-pAtr);
  const c1=pFeito,c2=c1+pAnd,c3=c2+pAtr;
  const donutBg=`conic-gradient(#163D34 0% ${c1}%,#BC933F ${c1}% ${c2}%,#8C2E2A ${c2}% ${c3}%,#D8D4CB ${c3}% 100%)`;
  const grupos=PHASES.map((ph,pi)=>{
    const list=A.filter(a=>a.fase===pi);
    const done=list.filter(a=>(a.pct||0)>=100).length;
    const pct=list.length?Math.round(list.reduce((s,a)=>s+(a.pct||0),0)/list.length):0;
    return{nome:ph.n,done,total:list.length,pct};
  }).filter(g=>g.total>0);
  const barsGrupos=grupos.map(g=>`
    <div class="pdfBarRow">
      <span class="pdfBarLabel">${esc(g.nome)}</span>
      <span class="pdfBarTrack"><span class="pdfBarFill" style="width:${g.pct}%"></span></span>
      <span class="pdfBarPct">${g.done}/${g.total} · ${g.pct}%</span>
    </div>`).join('');
  const listRows=(list,fields)=>{
    const shown=list.slice(0,PDF_LIST_MAX).map(fields).join('');
    const extra=list.length>PDF_LIST_MAX
      ?`<tr><td colspan="4">+ ${list.length-PDF_LIST_MAX} não listadas</td></tr>`:'';
    return shown+extra;
  };
  const rowsLate=listRows(late,a=>
    `<tr><td>${esc(a.nome)}</td><td>${esc(a.resp||'—')}</td><td>${lateDays(a)}d</td><td>${fmt(a.fim)}</td></tr>`);
  const rowsRunning=listRows(running,a=>
    `<tr><td>${esc(a.nome)}</td><td>${esc(a.resp||'—')}</td><td>${a.pct||0}%</td><td>${a.fim?fmt(a.fim):'sem prazo'}</td></tr>`);
  return `<div class="pdfPage">
    <div class="pdfBrand"><img src="${LOGO_PLUMA_B64}" alt="Pluma Agroavícola"><span class="div"></span><img src="${LOGO_FORUS_B64}" alt="Grupo Forus"></div>
    <h1>Cronograma da planta — resumo gerencial</h1>
    <div class="sub">Gerado em ${fmt(d2s(today()))} · ${A.length} atividades no total</div>
    <div class="pdfDonutWrap">
      <div class="pdfDonut" style="background:${donutBg}"><div class="hole"><div class="v">${overallPct(A)}%</div><div class="k">avanço geral</div></div></div>
      <div class="pdfLegend">
        <div><span class="sw" style="background:#163D34"></span>Concluídas — ${feito.length} (${pFeito}%)</div>
        <div><span class="sw" style="background:#BC933F"></span>Em andamento — ${running.length} (${pAnd}%)</div>
        <div><span class="sw" style="background:#8C2E2A"></span>Atrasadas — ${late.length} (${pAtr}%)</div>
        <div><span class="sw" style="background:#D8D4CB"></span>Outras (sem data / não iniciadas) — ${outras} (${pOut}%)</div>
      </div>
    </div>
    ${buildRoadmapHTML()}
    ${comentario?`<div class="pdfSection pdfComment">
      <h2>Comentário do gestor</h2>
      <p>${esc(comentario)}</p>
    </div>`:''}
    <div class="pdfSection">
      <h2>Avanço por grupo</h2>
      <div class="pdfBarsBox">${barsGrupos}</div>
    </div>
    ${late.length?`<div class="pdfSection">
      <h2>Atrasadas (${late.length})</h2>
      <table class="pdfTable">
        <thead><tr><th>Atividade</th><th>Responsável</th><th>Atraso</th><th>Prazo</th></tr></thead>
        <tbody>${rowsLate}</tbody>
      </table>
    </div>`:''}
    ${running.length?`<div class="pdfSection">
      <h2>Em andamento (${running.length})</h2>
      <table class="pdfTable">
        <thead><tr><th>Atividade</th><th>Responsável</th><th>Andamento</th><th>Prazo</th></tr></thead>
        <tbody>${rowsRunning}</tbody>
      </table>
    </div>`:''}
  </div>`;
}
async function printPDFSummary(){
  const comentario=await showGestorGate();
  if(comentario===null) return;
  const area=document.getElementById('pdfArea');
  area.innerHTML=buildPDFSummary(comentario);
  // window.print() logo em seguida podia disparar a impressão antes do
  // navegador terminar de decodificar/desenhar as logos recém-inseridas
  // (mesmo sendo data URI, não é instantâneo) — as logos simplesmente não
  // apareciam na saída. Espera cada <img> terminar de decodificar antes
  // de imprimir.
  const imgs=[...area.querySelectorAll('img')];
  await Promise.all(imgs.map(img=>
    img.decode?img.decode().catch(()=>{}):new Promise(res=>{
      if(img.complete) return res();
      img.onload=img.onerror=res;
    })
  ));
  window.print();
}

/* ---------- utilidades ---------- */
function uid(){return Math.random().toString(36).slice(2,10)}
// nome de arquivo com espaço/acento derruba o Storage do Supabase com
// "Invalid key" — usada só pra montar a chave de armazenamento; o nome
// original continua sendo mostrado pra pessoa normalmente
function sanitizeFilename(name){
  const lo=String.fromCodePoint(0x300),hi=String.fromCodePoint(0x36f);
  const diacriticos=new RegExp('['+lo+'-'+hi+']','g');
  const semAcento=name.normalize('NFD').replace(diacriticos,'');
  return semAcento.replace(/[^\w.\-]+/g,'_');
}
const txtCanvas=document.createElement('canvas').getContext('2d');
function textW(s){
  txtCanvas.font='500 9.5px "IBM Plex Mono","SF Mono",Menlo,monospace';
  return txtCanvas.measureText(s).width;
}

}

/* ---------- redimensionar coluna de atividade ---------- */
(function railResizeInit(){
  const RAILKEY='cronograma-planta-railw';
  const min=140,max=460;
  let active=false,startX=0,startW=0,curW=0;
  const saved=parseFloat(localStorage.getItem(RAILKEY));
  if(saved&&saved>=min&&saved<=max){
    document.documentElement.style.setProperty('--rail',saved+'px');
  }
  document.addEventListener('mousedown',down);
  document.addEventListener('touchstart',down,{passive:false});
  document.addEventListener('mousemove',move);
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('mouseup',up);
  document.addEventListener('touchend',up);
  function down(e){
    const handle=e.target.closest('#railResize');
    if(!handle)return;
    const pt=e.touches?e.touches[0]:e;
    startX=pt.clientX;
    startW=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail'))||250;
    curW=startW;active=true;
    handle.classList.add('active');
    e.preventDefault();
  }
  function move(e){
    if(!active)return;
    const pt=e.touches?e.touches[0]:e;
    curW=Math.min(max,Math.max(min,startW+(pt.clientX-startX)));
    document.documentElement.style.setProperty('--rail',curW+'px');
    e.preventDefault();
  }
  function up(){
    if(!active)return;
    active=false;
    document.querySelectorAll('#railResize.active').forEach(x=>x.classList.remove('active'));
    localStorage.setItem(RAILKEY,String(curW));
  }
})();

/* ---------- início ---------- */
(async()=>{
  await ensureAuth();
  const saved=await load();
  if(saved&&saved.acts&&saved.acts.length){
    state=saved;
  }else{
    state={acts:SEED.map(([f,n])=>({id:uid(),fase:f,nome:n,resp:'',ini:'',fim:'',pct:0,nota:''}))};
    state.phases=DEFAULT_PHASES.map(p=>({...p}));
    PHASES=state.phases;
    save();
  }
  state.phases=(state.phases&&state.phases.length)?state.phases:DEFAULT_PHASES.map(p=>({...p}));
  PHASES=state.phases;
  state.deletados=state.deletados||[];
  render();
  const sc=document.querySelector('.scroller');
  if(sc){const {t0}=span();sc.scrollLeft=Math.max(0,X(t0,today())-sc.clientWidth*0.25)}

  db.channel('cronograma_state_sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'cronograma_state',filter:'id=eq.1'},payload=>{
      if(!payload.new||!payload.new.data)return;
      state=payload.new.data;
      state.phases=(state.phases&&state.phases.length)?state.phases:DEFAULT_PHASES.map(p=>({...p}));
      PHASES=state.phases;
      state.deletados=state.deletados||[];
      render();
    })
    .subscribe();
})();
</script>
